<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNI Oaxaca · Centro de Recomendaciones</title>
<style>
  :root{
    --rojo:#A21D21;
    --rojo-oscuro:#6D0F12;
    --rojo-hover:#C62828;
    --blanco:#FFFFFF;
    --gris:#F5F5F5;
    --texto:#333333;
    --verde:#2E7D32;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--gris);
    color:var(--texto);
  }
  header{
    background:linear-gradient(135deg,var(--rojo) 0%,var(--rojo-oscuro) 100%);
    color:var(--blanco);
    text-align:center;
    padding:32px 16px 48px;
  }
  header .logo-img{
    max-width:280px;
    width:60%;
    height:auto;
    margin-bottom:6px;
    animation:fadeInDown .7s ease both;
  }
  header h2{
    margin:4px 0 12px;
    font-size:16px;
    font-weight:600;
    letter-spacing:1px;
    opacity:.95;
    animation:fadeInUp .7s ease .15s both;
  }
  header p{
    margin:0;
    font-size:14px;
    opacity:.85;
    animation:fadeInUp .7s ease .3s both;
  }
  @keyframes fadeInDown{
    from{opacity:0; transform:translateY(-14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .container{
    max-width:880px;
    margin:-28px auto 0;
    padding:0 16px 60px;
  }
  .search-box{
    background:var(--blanco);
    border-radius:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.12);
    padding:16px;
    animation:fadeInUp .6s ease .25s both;
    transition:box-shadow .25s;
  }
  .search-box:hover{
    box-shadow:0 10px 30px rgba(0,0,0,.16);
  }
  .search-box input{
    width:100%;
    padding:14px 16px;
    font-size:16px;
    border:2px solid #eee;
    border-radius:10px;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .search-box input:focus{
    border-color:var(--rojo);
    box-shadow:0 0 0 3px rgba(162,29,33,.12);
  }
  #results{
    margin-top:22px;
    display:grid;
    gap:14px;
  }
  .card{
    background:var(--blanco);
    border-radius:12px;
    padding:18px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    border-left:4px solid var(--rojo);
    animation:cardIn .45s ease both;
    transition:transform .2s, box-shadow .2s;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 24px rgba(0,0,0,.1);
  }
  .card .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  .card .photo{
    width:64px;
    height:64px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    border:2px solid var(--rojo);
    background:var(--gris);
  }
  .card h3{
    margin:0 0 4px;
    font-size:18px;
    letter-spacing:.3px;
  }
  .card .empresa{
    font-size:14px;
    color:var(--texto);
    opacity:.85;
    margin-bottom:8px;
  }
  .card .meta{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    font-size:12.5px;
    color:#777;
    margin-bottom:14px;
  }
  .card .meta span b{
    color:var(--texto);
  }
  .card .actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .btn{
    border:none;
    padding:9px 14px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    font-weight:600;
    transition:background .15s, transform .12s;
  }
  .btn:active{
    transform:scale(.96);
  }
  .btn-primary{
    background:var(--rojo);
    color:var(--blanco);
  }
  .btn-primary:hover{
    background:var(--rojo-hover);
  }
  .btn-secondary{
    background:var(--gris);
    color:var(--texto);
  }
  .btn-secondary:hover{
    background:#e8e8e8;
  }
  .more-options{
    max-height:0;
    overflow:hidden;
    margin-top:0;
    border-top:1px solid transparent;
    padding-top:0;
    opacity:0;
    transition:max-height .35s ease, opacity .3s ease, margin-top .3s ease, padding-top .3s ease;
  }
  .more-options.open{
    max-height:2000px;
    margin-top:14px;
    border-top:1px solid #eee;
    padding-top:14px;
    opacity:1;
  }
  .option{
    background:var(--gris);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
    font-size:13.5px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    transition:background .15s;
  }
  .option:hover{
    background:#ececec;
  }
  .option p{
    margin:0;
    flex:1;
    white-space:pre-line;
  }
  #empty{
    text-align:center;
    color:#999;
    padding:40px 0;
    display:none;
  }
  #toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--verde);
    color:var(--blanco);
    padding:12px 22px;
    border-radius:30px;
    font-size:14px;
    font-weight:600;
    box-shadow:0 6px 18px rgba(0,0,0,.2);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:999;
  }
  #toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .count{
    text-align:center;
    font-size:12.5px;
    color:#999;
    margin-top:14px;
  }
  @media (max-width:480px){
    .card .actions{flex-direction:column;}
    .btn{width:100%;text-align:center;}
  }
</style>
</head>
<body>

<header>
  <img class="logo-img" src="assets/bni-antequera-logo.png" alt="BNI Antequera">
  <h2>CENTRO DE RECOMENDACIONES</h2>
  <p>Encuentra miembros, copia recomendaciones y genera más negocios.</p>
</header>

<div class="container">
  <div class="search-box">
    <input id="search" type="text" placeholder="🔍 Escribe el nombre, empresa o categoría" autocomplete="off">
  </div>

  <div id="results"></div>
  <div id="empty">No se encontraron resultados.</div>
  <div class="count" id="count"></div>
</div>

<div id="toast">✅ Copiado correctamente</div>

<script>
let MIEMBROS = [];

const optionTemplates = [
  (n,l) => `Recomiendo ampliamente a ${n} por su profesionalismo y excelentes resultados. Ponte en contacto, te dejo su WhatsApp.\n\n${l}`,
  (n,l) => `Por experiencia propia, puedo recomendar el trabajo de ${n} con total confianza. Aquí te comparto sus datos.\n\n${l}`,
  (n,l) => `${n} es una persona confiable, responsable y orientada a resultados. No dudes en contactarlo(a), te dejo su información.\n\n${l}`,
  (n,l) => `${n} destaca por su profesionalismo, calidad y atención al detalle. Te comparto su WhatsApp para que puedas contactarlo(a).\n\n${l}`,
  (n,l) => `Recomiendo los servicios de ${n} por su compromiso y nivel de excelencia. Ponte en contacto y conoce cómo puede ayudarte.\n\n${l}`,
  (n,l) => `Sin duda, ${n} es una excelente opción para quienes buscan confianza y resultados. Te dejo sus datos de contacto.\n\n${l}`,
  (n,l) => `Compro los productos y servicios de ${n} y los recomiendo ampliamente por su calidad y atención. Aquí te comparto su información.\n\n${l}`,
  (n,l) => `He probado los productos y servicios de ${n} y los recomiendo por su calidad y confiabilidad. No dudes en ponerte en contacto.\n\n${l}`,
  (n,l) => `Cuando necesito este tipo de productos o servicios, ${n} es mi primera opción. Te dejo su WhatsApp.\n\n${l}`,
  (n,l) => `Recomiendo a ${n} por su confianza, calidad y cumplimiento. Vale la pena conocer su trabajo, aquí te comparto sus datos.\n\n${l}`
];

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg || '✅ Copiado correctamente';
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

function copyText(text, successMsg){
  navigator.clipboard.writeText(text).then(()=> showToast(successMsg)).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(successMsg);
  });
}

function filtrar(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  return MIEMBROS.filter(m=>{
    return !q ||
      m.nombre.toLowerCase().includes(q) ||
      (m.empresa||"").toLowerCase().includes(q) ||
      (m.categoria||"").toLowerCase().includes(q);
  });
}

function cardTemplate(m,i){
  const link = m.whatsapp;
  return `
  <div class="card" data-id="${m.id}" style="animation-delay:${Math.min(i*0.04,0.4)}s">
    <div class="top-row">
      <div>
        <h3>${m.nombre}</h3>
        <div class="empresa">${m.empresa || ''}</div>
      </div>
      <img class="photo" src="assets/photos/${m.id}.png" alt="${m.nombre}" loading="lazy" onerror="this.style.display='none'">
    </div>
    <div class="meta">
      <span>Categoría: <b>${m.categoria || '—'}</b></span>
      <span>Capítulo: <b>${m.capitulo || '—'}</b></span>
    </div>
    <div class="actions">
      <button class="btn btn-primary" data-action="copy-wa">Copiar WhatsApp</button>
      <button class="btn btn-primary" data-action="toggle-more">Opciones de Recomendación</button>
    </div>
    <div class="more-options">
      ${optionTemplates.map((fn,i)=>`
        <div class="option">
          <p>${fn(m.nombre, link)}</p>
          <button class="btn btn-secondary" data-action="copy-option" data-idx="${i}">COPIAR</button>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function renderResults(){
  const lista = filtrar();
  const resultsEl = document.getElementById('results');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');

  if(lista.length === 0){
    resultsEl.innerHTML = '';
    emptyEl.style.display = 'block';
    countEl.textContent = '';
    return;
  }
  emptyEl.style.display = 'none';
  resultsEl.innerHTML = lista.map((m,i)=>cardTemplate(m,i)).join('');
  countEl.textContent = `${lista.length} miembro${lista.length===1?'':'s'} encontrado${lista.length===1?'':'s'}`;
}

document.getElementById('results').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const card = btn.closest('.card');
  const id = Number(card.dataset.id);
  const m = MIEMBROS.find(x=>x.id===id);
  const action = btn.dataset.action;

  if(action === 'copy-wa'){
    copyText(m.whatsapp, '✅ Enlace copiado');
  } else if(action === 'toggle-more'){
    const panel = card.querySelector('.more-options');
    panel.classList.toggle('open');
    btn.textContent = panel.classList.contains('open') ? 'Ocultar opciones' : 'Opciones de Recomendación';
  } else if(action === 'copy-option'){
    const idx = Number(btn.dataset.idx);
    const text = optionTemplates[idx](m.nombre, m.whatsapp);
    copyText(text, '✅ Recomendación copiada');
  }
});

document.getElementById('search').addEventListener('input', renderResults);

fetch('miembros.json')
  .then(r => r.json())
  .then(data => {
    MIEMBROS = data;
    renderResults();
  })
  .catch(()=>{
    document.getElementById('results').innerHTML = '<p style="text-align:center;color:#999;">No se pudo cargar miembros.json</p>';
  });
</script>

</body>
</html>
